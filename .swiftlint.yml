included:
  - Sources
  - Tests
excluded:
  - .build
  - docs/spikes
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - fatal_error_message
  - todo
disabled_rules:
  - identifier_name
line_length:
  warning: 140
  error: 160
  ignores_comments: true
file_length:
  warning: 200
  error: 450
function_body_length:
  warning: 30
  error: 30
function_parameter_count:
  warning: 4
  error: 5
type_body_length:
  warning: 200
  error: 350
cyclomatic_complexity:
  warning: 10
  error: 15
