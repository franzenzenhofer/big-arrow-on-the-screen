name: Visual

# Records the arrows on a clean runner desktop (nothing personal on screen): screenshots,
# a demo video and GIF. Run by hand: gh workflow run visual.yml
on:
  workflow_dispatch:

jobs:
  visual:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Build
        run: swift build -c release
      - name: What this runner allows
        run: |
          .build/release/bigarrow doctor
          screencapture -x probe.png && sips -g pixelWidth -g pixelHeight probe.png
      - name: Record
        run: scripts/visual-check.sh visual-out
      - name: Record the demo GIF
        run: |
          brew install ffmpeg
          scripts/record-demo.sh visual-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual
          path: |
            probe.png
            visual-out/
